<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundBloom — 音を花に</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Zen+Kaku+Gothic+New:wght@300&display=swap');

  :root { --bg:#fdf8f3; --text:#5c4a3a; --muted:#b0927a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); font-family:'Zen Kaku Gothic New',sans-serif; color:var(--text); min-height:100vh; overflow:hidden; }

  canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; }
  #trail  { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }

  header { position:fixed; top:0; left:0; right:0; padding:24px 36px; display:flex; align-items:baseline; gap:10px; z-index:10; pointer-events:none; }
  header h1 { font-family:'Cormorant Garamond',serif; font-size:1.6rem; font-weight:300; letter-spacing:0.05em; }
  header span { font-size:0.7rem; color:var(--muted); letter-spacing:0.15em; text-transform:uppercase; }

  #micBtn {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:20; width:72px; height:72px; border-radius:50%; border:none;
    background:white; box-shadow:0 4px 24px rgba(180,120,100,0.22);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  #micBtn:hover { transform:translate(-50%,-50%) scale(1.08); }
  #micBtn.hidden { opacity:0; pointer-events:none; transform:translate(-50%,-50%) scale(0.7); }
  #micBtn svg { width:28px; height:28px; }

  #menuBtn {
    position:fixed; top:20px; right:24px; z-index:30;
    width:40px; height:40px; border-radius:10px; border:none;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(8px);
    box-shadow:0 2px 12px rgba(180,120,100,0.15);
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    transition:background 0.2s;
  }
  #menuBtn:hover { background:rgba(255,255,255,1); }
  #menuBtn span { display:block; width:18px; height:1.5px; background:var(--muted); border-radius:2px; transition:transform 0.3s ease,opacity 0.3s ease; }
  #menuBtn.open span:nth-child(1) { transform:translateY(6.5px) rotate(45deg); }
  #menuBtn.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
  #menuBtn.open span:nth-child(3) { transform:translateY(-6.5px) rotate(-45deg); }

  #settingsPanel {
    position:fixed; top:68px; right:24px; z-index:29; width:240px;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(12px);
    border-radius:16px; box-shadow:0 8px 32px rgba(180,120,100,0.18);
    padding:20px; transform:translateY(-8px) scale(0.97); opacity:0; pointer-events:none;
    transition:opacity 0.25s ease,transform 0.25s ease;
  }
  #settingsPanel.open { opacity:1; pointer-events:all; transform:translateY(0) scale(1); }

  .setting-label { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:block; }
  .setting-row { margin-bottom:18px; }
  .setting-row:last-child { margin-bottom:0; }
  .setting-val { font-size:0.7rem; color:var(--muted); float:right; margin-top:-4px; }
  .setting-note {
    font-size:0.6rem; color:var(--muted); line-height:1.6;
    margin-top:-12px; margin-bottom:16px; opacity:0.85;
  }

  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:3px; background:linear-gradient(90deg,#f472b6,#818cf8); border-radius:99px; outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:white; box-shadow:0 1px 6px rgba(180,100,120,0.35); border:2px solid #f472b6; }

  /* 帯域インジケーター */
  #bandIndicator {
    position:fixed; bottom:44px; left:50%; transform:translateX(-50%);
    z-index:10; display:flex; gap:10px; align-items:flex-end;
    pointer-events:none; opacity:0; transition:opacity 0.5s;
  }
  #bandIndicator.visible { opacity:1; }
  .band-bar-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .band-bar { width:6px; height:40px; border-radius:3px; position:relative; overflow:hidden; background:rgba(180,140,120,0.12); }
  .band-bar-fill { position:absolute; bottom:0; left:0; right:0; border-radius:3px; transition:height 0.05s linear; }
  .band-label { font-size:0.52rem; letter-spacing:0.1em; color:var(--muted); text-transform:uppercase; }

  /* トグル */
  .toggle-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .toggle-switch { position:relative; width:36px; height:20px; cursor:pointer; }
  .toggle-switch input { opacity:0; width:0; height:0; }
  .toggle-track { position:absolute; inset:0; border-radius:10px; background:rgba(180,140,120,0.2); transition:background 0.2s; }
  .toggle-thumb { position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:white; box-shadow:0 1px 4px rgba(0,0,0,0.15); transition:transform 0.2s; }
  .toggle-switch input:checked + .toggle-track { background:linear-gradient(90deg,#f472b6,#818cf8); }
  .toggle-switch input:checked ~ .toggle-thumb { transform:translateX(16px); }

  footer { position:fixed; bottom:20px; right:28px; z-index:10; pointer-events:none; font-size:0.62rem; letter-spacing:0.08em; color:var(--muted); opacity:0.6; }
  .error-msg { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:#fff0ed; border:1px solid #f9c8c8; color:#b05050; font-size:0.8rem; padding:10px 20px; border-radius:12px; display:none; z-index:30; }
</style>
</head>
<body>

<header>
  <h1>SoundBloom</h1>
  <span>音を花に変える</span>
</header>

<canvas id="trail"></canvas>
<canvas id="c"></canvas>

<button id="micBtn" title="マイクをオン">
  <svg viewBox="0 0 24 24" fill="none" stroke="#c8906a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="6" height="11" rx="3"/>
    <path d="M5 10a7 7 0 0 0 14 0"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="8" y1="22" x2="16" y2="22"/>
  </svg>
</button>

<!-- 帯域インジケーター -->
<div id="bandIndicator">
  <div class="band-bar-wrap">
    <div class="band-bar"><div class="band-bar-fill" id="barLow"  style="background:#fb923c"></div></div>
    <div class="band-label">低音</div>
  </div>
  <div class="band-bar-wrap">
    <div class="band-bar"><div class="band-bar-fill" id="barMid"  style="background:#f472b6"></div></div>
    <div class="band-label">声</div>
  </div>
  <div class="band-bar-wrap">
    <div class="band-bar"><div class="band-bar-fill" id="barHigh" style="background:#818cf8"></div></div>
    <div class="band-label">高音</div>
  </div>
</div>

<!-- バーガーメニュー -->
<button id="menuBtn" title="設定"><span></span><span></span><span></span></button>

<!-- 設定パネル -->
<div id="settingsPanel">
  <div class="setting-row">
    <span class="setting-label">感度 <span class="setting-val" id="sensVal">5</span></span>
    <input type="range" id="sensSlider" min="1" max="10" step="1" value="5">
  </div>
  <div class="setting-row">
    <span class="setting-label">反応の閾値 <span class="setting-val" id="threshVal">中</span></span>
    <input type="range" id="threshSlider" min="1" max="5" step="1" value="3">
  </div>
  <div class="toggle-row">
    <span class="setting-label" style="margin:0">音声認識テキスト</span>
    <label class="toggle-switch">
      <input type="checkbox" id="speechToggle">
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>
  <p class="setting-note">音声認識はChrome / Edge / Safari（iPhone含む）で動作します（Firefoxは未対応）。Androidでは音声認識中、エフェクトは声の認識に連動する簡易モードに切り替わります</p>
  <div class="toggle-row" style="margin-bottom:0">
    <span class="setting-label" style="margin:0">帯域インジケーター</span>
    <label class="toggle-switch">
      <input type="checkbox" id="bandToggle" checked>
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>
</div>

<footer>© 2026 rensapp</footer>
<div class="error-msg" id="errMsg"></div>

<script>
// ---- DOM ----
const trail       = document.getElementById('trail');
const tCtx        = trail.getContext('2d');
const canvas      = document.getElementById('c');
const ctx         = canvas.getContext('2d');
const micBtn      = document.getElementById('micBtn');
const errMsg      = document.getElementById('errMsg');
const menuBtn     = document.getElementById('menuBtn');
const settingsPanel = document.getElementById('settingsPanel');
const sensSlider  = document.getElementById('sensSlider');
const sensVal     = document.getElementById('sensVal');
const threshSlider= document.getElementById('threshSlider');
const threshVal   = document.getElementById('threshVal');
const speechToggle= document.getElementById('speechToggle');
const bandToggle  = document.getElementById('bandToggle');
const bandIndicator = document.getElementById('bandIndicator');
const barLow      = document.getElementById('barLow');
const barMid      = document.getElementById('barMid');
const barHigh     = document.getElementById('barHigh');

// ---- メニュー ----
menuBtn.addEventListener('click', () => {
  menuBtn.classList.toggle('open');
  settingsPanel.classList.toggle('open');
});

function getSensGamma() {
  const s = parseInt(sensSlider.value);
  return 2.8 - (s - 1) * (2.0 / 9);
}
const THRESH_LABELS = ['とても低','低','中','高','とても高'];
const THRESH_VALUES = [0.004,0.008,0.012,0.020,0.032];
function getThreshold() { return THRESH_VALUES[parseInt(threshSlider.value)-1]; }

sensSlider.addEventListener('input', () => { sensVal.textContent = sensSlider.value; });
threshSlider.addEventListener('input', () => { threshVal.textContent = THRESH_LABELS[parseInt(threshSlider.value)-1]; });

bandToggle.addEventListener('change', () => {
  bandIndicator.classList.toggle('visible', bandToggle.checked && isActive);
});

// ---- Canvas ----
let W, H;
function resize() {
  W = canvas.width = trail.width = window.innerWidth;
  H = canvas.height = trail.height = window.innerHeight;
  tCtx.fillStyle = '#fdf8f3';
  tCtx.fillRect(0,0,W,H);
}
resize();
window.addEventListener('resize', resize);

// ---- Audio ----
let analyser, dataArray, audioCtx;
let micStream = null;
let isActive = false;
let volume   = 0;

// 【Android対策】Android ChromeではgetUserMediaとSpeechRecognitionが
// マイクを同時に使えない（認識側が無音になる）。そのためAndroidでは
// 音声認識中はマイクを認識エンジンに明け渡し、エフェクトは認識イベントに
// 連動する「スピーチ駆動モード」へ切り替える。
const IS_ANDROID = /Android/i.test(navigator.userAgent);
let speechDriven = false;  // Android: 認識イベント駆動モード中
let speechPulse  = 0;      // 認識イベント由来の擬似音量(0〜1)

async function acquireMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  micStream = stream;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.88;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  source.connect(analyser);
}

function releaseMic() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx)  { try { audioCtx.close(); } catch(e) {} audioCtx = null; }
  analyser = null;
}

async function startAudio() {
  try {
    if (IS_ANDROID && speechToggle.checked) {
      speechDriven = true; // マイクは認識エンジン側が使う
    } else {
      await acquireMic();
    }
    isActive = true;
    micBtn.classList.add('hidden');
    errMsg.style.display = 'none';
    if (bandToggle.checked) bandIndicator.classList.add('visible');
    if (speechToggle.checked) startSpeech();
  } catch(e) {
    errMsg.textContent = 'マイクへのアクセスが許可されていません';
    errMsg.style.display = 'block';
  }
}
micBtn.addEventListener('click', () => { if (!isActive) startAudio(); });

// 周波数帯域ごとの音量
// fftSize=256 → 128bins / 低音: bin0-4 / 声: bin5-20 / 高音: bin21-60
function getBands() {
  if (!analyser) return { low:0, mid:0, high:0, total:0 };
  analyser.getByteFrequencyData(dataArray);
  const len = dataArray.length;
  let low=0, mid=0, high=0, total=0;
  for (let i=0; i<len; i++) {
    const v = dataArray[i]/255;
    total += v;
    if      (i <= 4)  low  += v;
    else if (i <= 20) mid  += v;
    else if (i <= 60) high += v;
  }
  return { low:low/5, mid:mid/16, high:high/40, total:total/len };
}

// ---- カラーパレット ----
const VIVID = ['#f472b6','#fb923c','#facc15','#4ade80','#38bdf8','#818cf8','#e879f9','#f87171','#34d399','#c084fc'];
const COL_LOW  = ['#fb923c','#f87171','#facc15'];
const COL_MID  = ['#f472b6','#e879f9','#c084fc'];
const COL_HIGH = ['#38bdf8','#818cf8','#34d399'];

const SCALE = 1.3;

// ---- FloatingText — 認識した言葉が中心から外へ漂う ----
const floatingTexts = [];
class FloatingText {
  constructor(text) {
    this.text = text;
    const angle = Math.random() * Math.PI * 2;
    const speed = (0.5 + Math.random() * 0.8);
    this.x = W/2; this.y = H/2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.size  = 16 + Math.random() * 12;
    this.color = VIVID[Math.floor(Math.random() * VIVID.length)];
    this.life  = 1.0;
    this.decay = 0.0035;
    this.age   = 0;
    this.tilt  = (Math.random() - 0.5) * 0.18; // ほんの少し傾ける
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.997;
    this.vy *= 0.997;
    this.life -= this.decay;
    this.age++;
  }
  _alpha() {
    const enter = Math.min(1, this.age / 14);
    const exit  = Math.min(1, this.life / 0.3);
    return 0.9 * enter * exit * this.life;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this._alpha();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.tilt);
    ctx.font = `300 ${this.size}px 'Zen Kaku Gothic New', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.fillText(this.text, 0, 0);
    ctx.restore();
  }
}

// ---- Web Speech API ----
// 【Android対策】Android ChromeではgetUserMedia（ビジュアライザー）と
// SpeechRecognitionがマイクを同時に掴めない制限がある。
// 対応ブラウザ（Chrome 139+）では既存マイクのトラックを認識エンジンに
// 直接渡して共有することで競合を回避する。未対応ブラウザでは引数は
// 無視され、従来どおりマイクからの認識を試みる。
let recognition = null;
let speechRestartTimer = null;
let speechTrack = null;      // 認識用に複製したトラック
let speechStartTime = 0;
let speechGotResult = false;
let speechFailCount = 0;     // 結果なし即終了の連続回数（暴走再起動の防止）

function tryStartRecognition() {
  if (!recognition) return;
  speechGotResult = false;
  speechStartTime = Date.now();
  // 前回の複製トラックを破棄
  if (speechTrack) { try { speechTrack.stop(); } catch(e) {} speechTrack = null; }
  try {
    const track = micStream ? micStream.getAudioTracks()[0] : null;
    if (track && track.readyState === 'live') {
      speechTrack = track.clone();
      recognition.start(speechTrack); // MediaStreamTrack入力（対応ブラウザのみ有効）
    } else {
      recognition.start();
    }
  } catch (err) {
    try { recognition.start(); } catch(e) {}
  }
}

function startSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { console.warn('SpeechRecognition not supported'); return; }
  if (recognition) return;

  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    speechGotResult = true;
    speechFailCount = 0;
    // スピーチ駆動モード用パルス：認識イベントのたびにエフェクトを咲かせる
    speechPulse = Math.min(1, 0.55 + Math.random() * 0.3);
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const t = e.results[i][0].transcript.trim();
        if (t) floatingTexts.push(new FloatingText(t));
      }
    }
  };

  recognition.onspeechstart = () => { speechPulse = Math.max(speechPulse, 0.7); };

  recognition.onerror = (e) => {
    // 'no-speech' / 'aborted' / 'audio-capture' はonend側の再起動に任せる
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      showSpeechError('音声認識を開始できませんでした（権限または非対応ブラウザの可能性）');
      disableSpeech();
    }
  };

  recognition.onend = () => {
    if (!isActive || !speechToggle.checked || !recognition) return;
    // 結果が一度も得られず2秒未満で終了 → マイク競合の典型症状としてカウント
    const dur = Date.now() - speechStartTime;
    if (!speechGotResult && dur < 2000) speechFailCount++;
    if (speechFailCount >= 5) {
      showSpeechError('この端末では音声認識を継続できないようです');
      disableSpeech();
      return;
    }
    // Androidでは即時再起動が失敗しやすいため少し待つ
    clearTimeout(speechRestartTimer);
    speechRestartTimer = setTimeout(tryStartRecognition, 500);
  };

  tryStartRecognition();
}

function stopSpeech() {
  clearTimeout(speechRestartTimer);
  speechFailCount = 0;
  speechPulse = 0;
  if (speechTrack) { try { speechTrack.stop(); } catch(e) {} speechTrack = null; }
  if (recognition) {
    recognition.onend = null; // 自動再起動を止める
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
}

// 音声認識をオフにし、Androidモードだった場合はマイク解析へ復帰する
async function disableSpeech() {
  stopSpeech();
  speechToggle.checked = false;
  if (speechDriven) {
    speechDriven = false;
    try { await acquireMic(); } catch(e) {}
  }
}

function showSpeechError(msg) {
  errMsg.textContent = msg;
  errMsg.style.display = 'block';
  setTimeout(() => { errMsg.style.display = 'none'; }, 6000);
}

speechToggle.addEventListener('change', async () => {
  if (speechToggle.checked && isActive) {
    if (IS_ANDROID) {
      // Android: マイクを認識エンジンへ明け渡し、スピーチ駆動モードへ
      releaseMic();
      speechDriven = true;
    }
    startSpeech();
  } else {
    stopSpeech();
    if (speechDriven) {
      speechDriven = false;
      try { await acquireMic(); } catch(e) {}
    }
  }
});

// ---- Petal（帯域タイプ対応・控えめ調整版） ----
class Petal {
  constructor(cx, cy, vol, type='mid') {
    this.type = type;
    const angle = Math.random() * Math.PI * 2;
    const speed = (0.35 + Math.random() * 1.0) * (0.3 + vol * 1.8) * SCALE;
    this.x = cx; this.y = cy;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (0.4 + Math.random() * 1.0) * SCALE;

    if (type === 'low') {
      this.size   = (8 + Math.random() * 18 * (0.4 + vol)) * SCALE;
      this.scaleX = 0.7 + Math.random() * 0.3;
      this.palette = COL_LOW;
    } else if (type === 'high') {
      this.size   = (3 + Math.random() * 10 * (0.2 + vol)) * SCALE;
      this.scaleX = 0.3 + Math.random() * 0.25;
      this.palette = COL_HIGH;
    } else {
      this.size   = (5 + Math.random() * 14 * (0.3 + vol)) * SCALE;
      this.scaleX = 0.45 + Math.random() * 0.5;
      this.palette = COL_MID;
    }
    this.color = this.palette[Math.floor(Math.random() * this.palette.length)];
    this.alpha = 0.65 + Math.random() * 0.25;
    this.life  = 1.0;
    this.decay = 0.004 + Math.random() * 0.008;
    this.rot   = Math.random() * Math.PI * 2;
    this.rotSpeed   = (Math.random() - 0.5) * (type==='high' ? 0.10 : 0.06);
    this.wobble     = Math.random() * Math.PI * 2;
    this.wobbleSpeed= 0.025 + Math.random() * 0.025;
    this.age    = 0;
  }
  update() {
    this.wobble += this.wobbleSpeed;
    this.vx += Math.sin(this.wobble) * 0.05;
    this.vy += 0.032 * SCALE;
    this.x  += this.vx; this.y  += this.vy;
    this.rot += this.rotSpeed;
    this.life -= this.decay;
    this.vx *= 0.990; this.vy *= 0.990;
    this.age++;
  }
  _alpha() {
    const enter = Math.min(1, this.age / 8);
    const exit  = Math.min(1, this.life / 0.25);
    return this.alpha * enter * exit * this.life;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this._alpha();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.scale(this.scaleX, 1);
    const s = this.size;
    if (this.type === 'high') {
      ctx.beginPath();
      for (let i=0; i<5; i++) {
        const a = (i/5)*Math.PI*2 - Math.PI/2;
        const b = a + Math.PI/5;
        ctx.lineTo(Math.cos(a)*s, Math.sin(a)*s);
        ctx.lineTo(Math.cos(b)*s*0.4, Math.sin(b)*s*0.4);
      }
      ctx.closePath();
    } else {
      ctx.beginPath();
      ctx.moveTo(0,-s);
      ctx.bezierCurveTo( s*.6,-s*.5,  s*.6, s*.5, 0,  s);
      ctx.bezierCurveTo(-s*.6, s*.5, -s*.6,-s*.5, 0, -s);
    }
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.type==='low' ? 14 : 10;
    ctx.fill();
    ctx.restore();
  }
}

// ---- CenterWave（控えめ調整版） ----
class CenterWave {
  constructor(vol) {
    this.r     = 0;
    this.maxR  = (160 + vol * 260) * SCALE;
    this.color = VIVID[Math.floor(Math.random() * VIVID.length)];
    this.life  = 1.0;
    this.decay = 0.010 + vol * 0.014;
    this.lineW = (0.7 + vol * 1.6) * SCALE;
    this.age   = 0;
  }
  update() { this.r += (this.maxR-this.r)*0.025; this.life -= this.decay; this.age++; }
  _alpha() {
    const enter = Math.min(1, this.age/10);
    const exit  = Math.min(1, this.life/0.20);
    return 0.32 * enter * exit;
  }
  draw(ctx, cx, cy) {
    ctx.save();
    ctx.globalAlpha = this._alpha();
    ctx.beginPath(); ctx.arc(cx, cy, this.r, 0, Math.PI*2);
    ctx.strokeStyle = this.color;
    ctx.lineWidth   = this.lineW * this.life;
    ctx.shadowColor = this.color; ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.restore();
  }
}

// ---- BloomCore（控えめ調整版） ----
class BloomCore {
  constructor() { this.petals=8; this.phase=0; this.scale=0; this.targetScale=0; this.rot=0; }
  update(vol) {
    this.phase += 0.016;
    this.rot   += 0.003 + vol * 0.03;
    this.targetScale = vol > 0.055 ? vol * 0.75 : 0;
    this.scale += (this.targetScale - this.scale) * 0.07;
  }
  draw(ctx, cx, cy) {
    if (this.scale < 0.01) return;
    const n=this.petals, r=60*this.scale*SCALE, inner=r*0.4;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(this.rot);
    for (let i=0; i<n; i++) {
      const angle=(i/n)*Math.PI*2;
      const px=Math.cos(angle)*r, py=Math.sin(angle)*r;
      ctx.save(); ctx.rotate(angle);
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.bezierCurveTo(inner,-inner*.4,r*.7,py*.1-inner*.3,px,py);
      ctx.bezierCurveTo(r*.7,py*.1+inner*.3,inner,inner*.4,0,0);
      const c=VIVID[i%VIVID.length];
      ctx.fillStyle=c; ctx.globalAlpha=0.55+0.18*Math.sin(this.phase+i);
      ctx.shadowColor=c; ctx.shadowBlur=18; ctx.fill(); ctx.restore();
    }
    const grd=ctx.createRadialGradient(0,0,0,0,0,r*.22);
    grd.addColorStop(0,'rgba(255,255,255,0.95)'); grd.addColorStop(1,'rgba(255,240,220,0)');
    ctx.beginPath(); ctx.arc(0,0,r*.22,0,Math.PI*2);
    ctx.fillStyle=grd; ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.fill();
    ctx.restore();
  }
}

// ---- State ----
const particles   = [];
const centerWaves = [];
const bloom       = new BloomCore();
let burstTimer    = 0;
let waveTimer     = 0;
let smoothVol     = 0;
let smoothLow=0, smoothMid=0, smoothHigh=0;
let noiseFloorLow = 0;   // 低音ノイズフロア（ファン音などの定常ノイズ対策）
let calibFrames   = 0;

// 控えめなスポーン数
function spawnBurst(bands) {
  const cx=W/2, cy=H/2;
  if (bands.low > 0.10) {
    const cnt = Math.floor(1 + bands.low * 4);
    for (let i=0; i<cnt; i++) particles.push(new Petal(cx, cy, bands.low, 'low'));
  }
  if (bands.mid > 0.06) {
    const cnt = Math.floor(1 + bands.mid * 5);
    for (let i=0; i<cnt; i++) particles.push(new Petal(cx, cy, bands.mid, 'mid'));
  }
  if (bands.high > 0.05) {
    const cnt = Math.floor(1 + bands.high * 6);
    for (let i=0; i<cnt; i++) particles.push(new Petal(cx, cy, bands.high, 'high'));
  }
}

function spawnWave(vol) { centerWaves.push(new CenterWave(vol)); }

function animate() {
  requestAnimationFrame(animate);

  let bands = getBands();

  // 【Androidスピーチ駆動モード】マイク解析の代わりに
  // 認識イベント由来のパルスでエフェクトを駆動する
  if (speechDriven) {
    speechPulse *= 0.965; // ゆっくり減衰
    bands = {
      low:   0,
      mid:   speechPulse * 0.55,
      high:  speechPulse * 0.22,
      total: speechPulse * 0.38,
    };
  }

  // 低音ノイズフロア自動キャリブレーション
  // PCファンなどの「鳴り続けている低音」を学習して差し引く。
  // 音が下がったときはフロアを素早く追従、上がるときはごくゆっくり上昇
  // → 一瞬のドラム音はフロアに吸収されず、定常ノイズだけが消える
  if (isActive) {
    calibFrames++;
    const riseRate = calibFrames < 180 ? 0.04 : 0.0015; // 開始後約3秒は高速学習
    if (bands.low < noiseFloorLow) noiseFloorLow += (bands.low - noiseFloorLow) * 0.3;
    else                           noiseFloorLow += (bands.low - noiseFloorLow) * riseRate;
    bands.low = Math.max(0, (bands.low - noiseFloorLow) / Math.max(0.05, 1 - noiseFloorLow));
  }

  smoothLow  += (bands.low  - smoothLow)  * 0.15;
  smoothMid  += (bands.mid  - smoothMid)  * 0.15;
  smoothHigh += (bands.high - smoothHigh) * 0.15;
  smoothVol  += (bands.total - smoothVol) * 0.12;
  volume = smoothVol;

  const gamma  = getSensGamma();
  const expVol = Math.pow(volume, gamma);
  const thresh = getThreshold();

  if (bandToggle.checked) {
    barLow.style.height  = Math.min(100, smoothLow  * 300) + '%';
    barMid.style.height  = Math.min(100, smoothMid  * 300) + '%';
    barHigh.style.height = Math.min(100, smoothHigh * 300) + '%';
  }

  if (isActive && expVol > thresh) {
    burstTimer++;
    if (burstTimer > 7) { spawnBurst(bands); burstTimer = 0; }
    waveTimer++;
    const waveInterval = Math.max(14, Math.floor(50 - expVol * 70));
    if (waveTimer > waveInterval) { spawnWave(expVol); waveTimer = 0; }
  } else {
    burstTimer = 0; waveTimer = 0;
  }

  tCtx.clearRect(0,0,W,H);
  ctx.clearRect(0,0,W,H);

  const grd = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,280*SCALE);
  grd.addColorStop(0, `rgba(253,220,200,${0.05+volume*0.14})`);
  grd.addColorStop(1, 'rgba(253,248,243,0)');
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

  for (let i=centerWaves.length-1; i>=0; i--) {
    centerWaves[i].update(); centerWaves[i].draw(ctx,W/2,H/2);
    if (centerWaves[i].life<=0) centerWaves.splice(i,1);
  }
  for (let i=particles.length-1; i>=0; i--) {
    particles[i].update(); particles[i].draw(ctx);
    if (particles[i].life<=0) particles.splice(i,1);
  }

  // 認識テキスト（中心から外へ漂う）
  for (let i=floatingTexts.length-1; i>=0; i--) {
    floatingTexts[i].update(); floatingTexts[i].draw(ctx);
    if (floatingTexts[i].life<=0) floatingTexts.splice(i,1);
  }

  bloom.update(isActive ? expVol : 0);
  bloom.draw(ctx, W/2, H/2);
}

tCtx.fillStyle='#fdf8f3'; tCtx.fillRect(0,0,W,H);
animate();
</script>
