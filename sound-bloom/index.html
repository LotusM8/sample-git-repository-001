<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundBloom — 音を花に</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Zen+Kaku+Gothic+New:wght@300&display=swap');

  :root {
    --bg: #fdf8f3;
    --text: #5c4a3a;
    --muted: #b0927a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  #trail  { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 24px 36px;
    display: flex; align-items: baseline; gap: 10px;
    z-index: 10; pointer-events: none;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem; font-weight: 300; letter-spacing: 0.05em;
  }
  header span { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }

  /* マイクボタン */
  #micBtn {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: 72px; height: 72px; border-radius: 50%; border: none;
    background: white;
    box-shadow: 0 4px 24px rgba(180,120,100,0.22);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #micBtn:hover { transform: translate(-50%, -50%) scale(1.08); }
  #micBtn.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(0.7); }
  #micBtn svg { width: 28px; height: 28px; }

  /* バーガーメニューボタン */
  #menuBtn {
    position: fixed; top: 20px; right: 24px;
    z-index: 30;
    width: 40px; height: 40px; border-radius: 10px; border: none;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(180,120,100,0.15);
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    transition: background 0.2s;
  }
  #menuBtn:hover { background: rgba(255,255,255,1); }
  #menuBtn span {
    display: block; width: 18px; height: 1.5px;
    background: var(--muted); border-radius: 2px;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  #menuBtn.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  #menuBtn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  #menuBtn.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  /* 設定パネル */
  #settingsPanel {
    position: fixed; top: 68px; right: 24px;
    z-index: 29;
    width: 220px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(180,120,100,0.18);
    padding: 20px;
    transform: translateY(-8px) scale(0.97);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #settingsPanel.open {
    opacity: 1; pointer-events: all;
    transform: translateY(0) scale(1);
  }
  .setting-label {
    font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px; display: block;
  }
  .setting-row { margin-bottom: 18px; }
  .setting-row:last-child { margin-bottom: 0; }

  /* スライダー */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, #f472b6, #818cf8);
    border-radius: 99px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: white;
    box-shadow: 0 1px 6px rgba(180,100,120,0.35);
    border: 2px solid #f472b6;
  }
  .setting-val {
    font-size: 0.7rem; color: var(--muted);
    float: right; margin-top: -4px;
  }

  /* フッター */
  footer {
    position: fixed; bottom: 20px; right: 28px;
    z-index: 10; pointer-events: none;
    font-size: 0.62rem; letter-spacing: 0.08em;
    color: var(--muted); opacity: 0.6;
  }

  .error-msg {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: #fff0ed; border: 1px solid #f9c8c8; color: #b05050;
    font-size: 0.8rem; padding: 10px 20px; border-radius: 12px;
    display: none; z-index: 30;
  }
</style>
</head>
<body>

<header>
  <h1>SoundBloom</h1>
  <span>音を花に変える</span>
</header>

<canvas id="trail"></canvas>
<canvas id="c"></canvas>

<button id="micBtn" title="マイクをオン">
  <svg viewBox="0 0 24 24" fill="none" stroke="#c8906a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="6" height="11" rx="3"/>
    <path d="M5 10a7 7 0 0 0 14 0"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="8" y1="22" x2="16" y2="22"/>
  </svg>
</button>

<!-- バーガーメニュー -->
<button id="menuBtn" title="設定">
  <span></span><span></span><span></span>
</button>

<!-- 設定パネル -->
<div id="settingsPanel">
  <div class="setting-row">
    <span class="setting-label">感度 <span class="setting-val" id="sensVal">5</span></span>
    <input type="range" id="sensSlider" min="1" max="10" step="1" value="5">
  </div>
  <div class="setting-row">
    <span class="setting-label">反応の閾値 <span class="setting-val" id="threshVal">中</span></span>
    <input type="range" id="threshSlider" min="1" max="5" step="1" value="3">
  </div>
</div>

<footer>© 2026 rensapp</footer>
<div class="error-msg" id="errMsg"></div>

<script>
const trail  = document.getElementById('trail');
const tCtx   = trail.getContext('2d');
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const micBtn = document.getElementById('micBtn');
const errMsg = document.getElementById('errMsg');

// ---- メニュー ----
const menuBtn       = document.getElementById('menuBtn');
const settingsPanel = document.getElementById('settingsPanel');
const sensSlider    = document.getElementById('sensSlider');
const sensVal       = document.getElementById('sensVal');
const threshSlider  = document.getElementById('threshSlider');
const threshVal     = document.getElementById('threshVal');

menuBtn.addEventListener('click', () => {
  menuBtn.classList.toggle('open');
  settingsPanel.classList.toggle('open');
});

// 感度: 1〜10 → gamma補正の指数に変換（高いほど小さい音にも反応）
// 感度1: gamma=2.8（鈍感）/ 感度5: gamma=1.8（中） / 感度10: gamma=0.8（敏感）
function getSensGamma() {
  const s = parseInt(sensSlider.value);
  return 2.8 - (s - 1) * (2.0 / 9);
}

// 閾値: 1〜5 → expVol閾値に変換
const THRESH_LABELS = ['とても低', '低', '中', '高', 'とても高'];
const THRESH_VALUES = [0.004, 0.008, 0.012, 0.020, 0.032];
function getThreshold() { return THRESH_VALUES[parseInt(threshSlider.value) - 1]; }

sensSlider.addEventListener('input', () => { sensVal.textContent = sensSlider.value; });
threshSlider.addEventListener('input', () => {
  threshVal.textContent = THRESH_LABELS[parseInt(threshSlider.value) - 1];
});

// ---- Canvas ----
let W, H;
function resize() {
  W = canvas.width = trail.width = window.innerWidth;
  H = canvas.height = trail.height = window.innerHeight;
  tCtx.fillStyle = '#fdf8f3';
  tCtx.fillRect(0, 0, W, H);
}
resize();
window.addEventListener('resize', resize);

// ---- Audio ----
let analyser, dataArray, audioCtx;
let isActive = false;
let volume   = 0;

async function startAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.88;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
    isActive = true;
    micBtn.classList.add('hidden');
    errMsg.style.display = 'none';
  } catch(e) {
    errMsg.textContent = 'マイクへのアクセスが許可されていません';
    errMsg.style.display = 'block';
  }
}

micBtn.addEventListener('click', () => { if (!isActive) startAudio(); });

function getVolume() {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
  return sum / (dataArray.length * 255);
}

// ---- カラーパレット ----
const VIVID = [
  '#f472b6','#fb923c','#facc15','#4ade80',
  '#38bdf8','#818cf8','#e879f9','#f87171',
  '#34d399','#c084fc',
];

// スケール係数 1.3倍
const SCALE = 1.3;

// ---- Petal ----
class Petal {
  constructor(cx, cy, vol) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (0.4 + Math.random() * 1.2) * (0.3 + vol * 2.2) * SCALE;
    this.x = cx; this.y = cy;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (0.5 + Math.random() * 1.2) * SCALE;
    this.size  = (6 + Math.random() * 20 * (0.3 + vol)) * SCALE;
    this.color = VIVID[Math.floor(Math.random() * VIVID.length)];
    this.alpha = 0.7 + Math.random() * 0.3;
    this.life  = 1.0;
    this.decay = 0.004 + Math.random() * 0.008;
    this.rot   = Math.random() * Math.PI * 2;
    this.rotSpeed  = (Math.random() - 0.5) * 0.06;
    this.scaleX    = 0.45 + Math.random() * 0.5;
    this.wobble    = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.025 + Math.random() * 0.025;
    this.age    = 0;
    this.fadeIn = 0;
  }
  update() {
    this.wobble += this.wobbleSpeed;
    this.vx += Math.sin(this.wobble) * 0.05;
    this.vy += 0.032 * SCALE;
    this.x  += this.vx;
    this.y  += this.vy;
    this.rot  += this.rotSpeed;
    this.life -= this.decay;
    this.vx *= 0.990;
    this.vy *= 0.990;
    this.age++;
    this.fadeIn = Math.min(1, this.age / 8);
  }
  _alpha() {
    const enter = this.fadeIn;
    const exit  = Math.min(1, this.life / 0.25);
    return this.alpha * enter * exit * this.life;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this._alpha();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.scale(this.scaleX, 1);
    const s = this.size;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo( s*.6,-s*.5,  s*.6, s*.5, 0,  s);
    ctx.bezierCurveTo(-s*.6, s*.5, -s*.6,-s*.5, 0, -s);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.restore();
  }
}

// ---- CenterWave ----
class CenterWave {
  constructor(vol) {
    this.r     = 0;
    this.maxR  = (180 + vol * 300) * SCALE;
    this.color = VIVID[Math.floor(Math.random() * VIVID.length)];
    this.life  = 1.0;
    this.decay = 0.010 + vol * 0.014;
    this.lineW = (0.8 + vol * 2.0) * SCALE;
    this.age   = 0;
  }
  update() {
    this.r    += (this.maxR - this.r) * 0.025;
    this.life -= this.decay;
    this.age++;
  }
  _alpha() {
    const enter = Math.min(1, this.age / 10);
    const exit  = Math.min(1, this.life / 0.20);
    return 0.45 * enter * exit;
  }
  draw(ctx, cx, cy) {
    ctx.save();
    ctx.globalAlpha = this._alpha();
    ctx.beginPath();
    ctx.arc(cx, cy, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = this.color;
    ctx.lineWidth   = this.lineW * this.life;
    ctx.shadowColor = this.color;
    ctx.shadowBlur  = 14;
    ctx.stroke();
    ctx.restore();
  }
}

// ---- BloomCore ----
class BloomCore {
  constructor() {
    this.petals = 8;
    this.phase  = 0;
    this.scale  = 0;
    this.targetScale = 0;
    this.rot    = 0;
  }
  update(vol) {
    this.phase += 0.016;
    this.rot   += 0.003 + vol * 0.035;
    this.targetScale = vol > 0.055 ? vol * 0.9 : 0;
    this.scale += (this.targetScale - this.scale) * 0.07;
  }
  draw(ctx, cx, cy) {
    if (this.scale < 0.01) return;
    const n = this.petals;
    const r = 60 * this.scale * SCALE;
    const inner = r * 0.4;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.rot);
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * Math.PI * 2;
      const px = Math.cos(angle) * r;
      const py = Math.sin(angle) * r;
      ctx.save();
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(inner, -inner*.4, r*.7, py*.1 - inner*.3, px, py);
      ctx.bezierCurveTo(r*.7,  py*.1 + inner*.3, inner, inner*.4, 0, 0);
      const c = VIVID[i % VIVID.length];
      ctx.fillStyle = c;
      ctx.globalAlpha = 0.6 + 0.2 * Math.sin(this.phase + i);
      ctx.shadowColor = c;
      ctx.shadowBlur  = 22;
      ctx.fill();
      ctx.restore();
    }
    const grd = ctx.createRadialGradient(0,0,0, 0,0, r*.22);
    grd.addColorStop(0, 'rgba(255,255,255,0.95)');
    grd.addColorStop(1, 'rgba(255,240,220,0.0)');
    ctx.beginPath();
    ctx.arc(0, 0, r*.22, 0, Math.PI*2);
    ctx.fillStyle = grd;
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
    ctx.fill();
    ctx.restore();
  }
}

// ---- State ----
const particles   = [];
const centerWaves = [];
const bloom       = new BloomCore();
let burstTimer    = 0;
let waveTimer     = 0;
let smoothVol     = 0;

function spawnBurst(vol) {
  const cx = W/2, cy = H/2;
  const count = Math.floor(1 + vol * 10);
  for (let i = 0; i < count; i++) particles.push(new Petal(cx, cy, vol));
}

function spawnWave(vol) {
  centerWaves.push(new CenterWave(vol));
}

function animate() {
  requestAnimationFrame(animate);

  const raw = getVolume();
  smoothVol += (raw - smoothVol) * 0.12;
  volume = smoothVol;

  // 感度スライダーに応じたgamma補正
  const gamma  = getSensGamma();
  const expVol = Math.pow(volume, gamma);
  const thresh = getThreshold();

  if (isActive && expVol > thresh) {
    burstTimer++;
    if (burstTimer > 5) { spawnBurst(expVol); burstTimer = 0; }

    waveTimer++;
    const waveInterval = Math.max(10, Math.floor(42 - expVol * 80));
    if (waveTimer > waveInterval) { spawnWave(expVol); waveTimer = 0; }
  } else {
    burstTimer = 0;
    waveTimer  = 0;
  }

  tCtx.clearRect(0, 0, W, H);
  ctx.clearRect(0, 0, W, H);

  const grd = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 280 * SCALE);
  grd.addColorStop(0, `rgba(253,220,200,${0.06 + volume * 0.18})`);
  grd.addColorStop(1, 'rgba(253,248,243,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  for (let i = centerWaves.length - 1; i >= 0; i--) {
    centerWaves[i].update();
    centerWaves[i].draw(ctx, W/2, H/2);
    if (centerWaves[i].life <= 0) centerWaves.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  bloom.update(isActive ? expVol : 0);
  bloom.draw(ctx, W/2, H/2);
}

tCtx.fillStyle = '#fdf8f3';
tCtx.fillRect(0, 0, W, H);
animate();
</script>
</body>
</html>
