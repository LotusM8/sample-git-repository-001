<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule Merger v1 — A → B 反映ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f1ea;
    --paper-2:#ece7db;
    --ink:#1c1b18;
    --ink-soft:#54514a;
    --line:#d8d2c4;
    --accent:#1f5f5b;       /* deep teal */
    --accent-ink:#0d3b38;
    --ok:#2e7d4f;
    --ok-bg:#e4f1e7;
    --warn:#9a5b00;
    --warn-bg:#faecd2;
    --err:#a8331f;
    --err-bg:#f7e0da;
    --frame:#1f5f5b;
    --ignore:#8a8478;
    --shadow:0 1px 0 #fff inset, 0 2px 8px rgba(28,27,24,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 500px at 12% -5%, #ffffff 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:32px 28px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  header.app{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:8px;
    flex-wrap:wrap;
  }
  .title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .title h1{
    font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1;
  }
  .title .ver{
    font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;
    color:var(--paper);background:var(--accent);padding:3px 8px;border-radius:4px;
    letter-spacing:.02em;
  }
  .title .sub{color:var(--ink-soft);font-size:13px;font-weight:500}
  .scope{
    font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--accent-ink);
    background:var(--paper-2);border:1px solid var(--line);padding:6px 10px;border-radius:6px;
  }
  .scope b{color:var(--accent)}
  .steps{
    display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;
  }
  @media(max-width:820px){.steps{grid-template-columns:1fr}}
  .pane{
    background:#fbf9f4;border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
  }
  .pane .head{
    display:flex;align-items:center;gap:10px;padding:11px 14px;
    border-bottom:1px solid var(--line);background:var(--paper-2);
  }
  .pane .head .badge{
    font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;
    width:24px;height:24px;display:grid;place-items:center;border-radius:6px;
    background:var(--ink);color:var(--paper);
  }
  .pane .head h2{font-size:14px;margin:0;font-weight:700;letter-spacing:-.01em}
  .pane .head .hint{margin-left:auto;font-size:11px;color:var(--ink-soft)}
  textarea{
    width:100%;border:0;resize:vertical;min-height:200px;padding:13px 14px;
    font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.5;
    background:transparent;color:var(--ink);outline:none;
  }
  textarea::placeholder{color:#b3ad9f}
  .toolbar{
    display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;
  }
  button{
    font-family:"Archivo",sans-serif;font-weight:700;font-size:14px;cursor:pointer;
    border-radius:9px;border:1px solid var(--ink);padding:11px 20px;transition:.12s;
    background:var(--ink);color:var(--paper);letter-spacing:.01em;
  }
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.ghost{background:transparent;color:var(--ink)}
  button.ghost:hover{background:var(--paper-2)}
  button.accent{background:var(--accent);border-color:var(--accent-ink)}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .msg{margin-left:auto;font-size:13px;font-weight:600}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}

  section.result{margin-top:30px;display:none}
  section.result.show{display:block;animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{
    border:1px solid var(--line);border-radius:10px;background:#fbf9f4;
    padding:8px 14px;min-width:96px;
  }
  .stat .n{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:20px;line-height:1}
  .stat .l{font-size:11px;color:var(--ink-soft);margin-top:3px}
  .stat.bad .n{color:var(--err)}
  .stat.warn .n{color:var(--warn)}

  .banner{
    border-radius:10px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:14px;
    display:flex;gap:9px;align-items:flex-start;
  }
  .banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #e7c48a}
  .banner.err{background:var(--err-bg);color:var(--err);border:1px solid #e3a596}

  .sec-title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-soft);margin:24px 0 10px}

  table.cmp{
    width:100%;border-collapse:collapse;font-size:12.5px;background:#fbf9f4;
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  table.cmp th{
    text-align:left;font-size:11px;letter-spacing:.03em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700;padding:9px 12px;background:var(--paper-2);
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  table.cmp td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.cmp tr:last-child td{border-bottom:0}
  table.cmp .no{font-family:"JetBrains Mono",monospace;color:var(--ink-soft);width:34px}
  table.cmp .name{font-weight:500}
  table.cmp tr.mismatch{background:var(--err-bg)}
  table.cmp tr.nopair{background:var(--warn-bg)}
  .pill{
    font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:20px;display:inline-block;white-space:nowrap;
  }
  .pill.match{background:var(--ok-bg);color:var(--ok)}
  .pill.nomatch{background:var(--err-bg);color:var(--err)}
  .pill.has{background:#e3eeec;color:var(--accent)}
  .pill.empty{background:#ece9e0;color:var(--ignore)}
  .g{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.02em}
  .g.frame{color:var(--frame)}
  .g.ignore{color:var(--ignore)}
  .flag{color:var(--err);font-size:11px;font-weight:700;display:block;margin-top:3px}

  .out-head{display:flex;align-items:center;gap:12px;margin:24px 0 10px}
  .out-head .sec-title{margin:0}
  .out-head .len{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft)}
  #output{
    width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;
    background:#15302e;color:#d6ece8;font-family:"JetBrains Mono",monospace;
    font-size:11.5px;line-height:1.45;padding:14px;resize:vertical;white-space:pre-wrap;
    word-break:break-all;
  }
  footer{margin-top:40px;font-size:11px;color:var(--ink-soft);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="title">
      <h1>Schedule&nbsp;Merger</h1>
      <span class="ver">v1</span>
      <span class="sub">A の試験スケジュールを B（CMS書き出しJSON）へ反映し B′ を生成</span>
    </div>
    <div class="scope">対象セクション: <b>Specified Skilled Worker (i)</b></div>
  </header>

  <div class="steps">
    <div class="pane">
      <div class="head"><span class="badge">A</span><h2>更新スケジュール</h2>
        <span class="hint">■分野見出し区切りのテキスト</span></div>
      <textarea id="inA" spellcheck="false" placeholder="■For All Fields&#10;<p class=&quot;m-txt-table-caption m-txt-p&quot;>Exam schedule</p>&#10;<table class=&quot;m-table-common&quot;> … </table>&#10;&#10;■Nursing Care Field&#10; …"></textarea>
    </div>
    <div class="pane">
      <div class="head"><span class="badge">B</span><h2>現行コンテンツ</h2>
        <span class="hint">CMSエクスポートのJSON配列</span></div>
      <textarea id="inB" spellcheck="false" placeholder="[{&quot;id&quot;:&quot;…&quot;,&quot;type&quot;:&quot;headline&quot;, … },{ … }]"></textarea>
    </div>
  </div>

  <div class="toolbar">
    <button class="accent" id="run">変換を実行</button>
    <button class="ghost" id="clear">クリア</button>
    <span class="msg" id="msg"></span>
  </div>

  <section class="result" id="result">
    <div class="summary" id="summary"></div>
    <div id="banners"></div>

    <div class="sec-title">照合表（位置ベースで上から対応／名前は確認用）</div>
    <table class="cmp">
      <thead>
        <tr>
          <th class="no">#</th>
          <th>分野名 A</th>
          <th>分野名 B</th>
          <th>一致</th>
          <th>A テーブル</th>
          <th>反映後 group</th>
        </tr>
      </thead>
      <tbody id="cmpBody"></tbody>
    </table>

    <div class="out-head">
      <div class="sec-title">B′ 出力（minified JSON）</div>
      <span class="len" id="outLen"></span>
      <button class="ghost" id="copy" style="margin-left:auto;padding:7px 14px;font-size:13px">コピー</button>
    </div>
    <textarea id="output" spellcheck="false" readonly></textarea>
  </section>

  <footer>位置ベース置換 · 名前は照合表示のみ · (i)セクションのテーブル入り richtext を上から順に処理</footer>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const norm = s => (s||'').replace(/\s+/g,'').toLowerCase();

  // A をパース → [{name, hasTable, content, malformed}]
  function parseA(raw){
    raw = raw.replace(/^\uFEFF/,'');
    const parts = raw.split(/^■/m).map(s=>s).filter(s=>s.trim().length);
    return parts.map(p=>{
      const nl = p.indexOf('\n');
      const name = (nl<0 ? p : p.slice(0,nl)).trim();
      const body = nl<0 ? '' : p.slice(nl+1);
      const hasTable = /m-table-common/.test(body);
      let content = '';
      let malformed = false;
      if(hasTable){
        const m = body.match(/<p class="m-txt-table-caption[\s\S]*?<\/table>/);
        content = m ? m[0] : body.trim();
        // 壊れたセル検出（例: <td></tbody>）
        if(/<td>\s*<\/(tbody|table)>/.test(content)) malformed = true;
      }
      return {name, hasTable, content, malformed};
    });
  }

  // B をパース → {data, slots:[{name, block}], iFound}
  function parseB(raw){
    const data = JSON.parse(raw);
    if(!Array.isArray(data)) throw new Error('B は JSON配列ではありません。');
    let iStart=-1, iEnd=-1;
    data.forEach((b,idx)=>{
      if(b && b.type==='headline' && b['headline-type']==='lv2'){
        const t = b['headline-text']||'';
        if(/\(i\)\s*exam schedule/i.test(t) && !/\(ii\)/i.test(t)) iStart=idx;
        if(/\(ii\)\s*exam schedule/i.test(t)) iEnd=idx;
      }
    });
    if(iStart<0) throw new Error('B 内に「(i) exam schedule」の見出しが見つかりません。');
    if(iEnd<0 || iEnd<iStart) iEnd = data.length; // (ii)が無ければ末尾まで
    // 各 frame 見出し直後の最初の richtext をスロットに
    const slots=[]; let cur=null, taken=true;
    for(let idx=iStart; idx<iEnd; idx++){
      const b=data[idx];
      if(b && b.type==='headline' && b['headline-type']==='frame'){ cur=b['headline-text']||''; taken=false; }
      else if(b && b.type==='richtext' && !taken && cur!==null){ slots.push({name:cur, block:b}); taken=true; }
    }
    return {data, slots};
  }

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  $('run').addEventListener('click', run);
  $('clear').addEventListener('click', ()=>{
    $('inA').value=''; $('inB').value=''; $('result').classList.remove('show');
    setMsg('','');
  });
  $('copy').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText($('output').value);
      $('copy').textContent='コピーしました ✓';
      setTimeout(()=>$('copy').textContent='コピー',1500);
    }catch(e){ $('output').select(); document.execCommand('copy'); }
  });

  function setMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg'+(cls?' '+cls:'');}

  function run(){
    const aRaw=$('inA').value, bRaw=$('inB').value;
    if(!aRaw.trim()||!bRaw.trim()){ setMsg('A と B の両方を貼り付けてください。','err'); return; }
    let A, B;
    try{ A = parseA(aRaw); }
    catch(e){ setMsg('A の解析に失敗: '+e.message,'err'); return; }
    let parsed;
    try{ parsed = parseB(bRaw); }
    catch(e){ setMsg('B の解析に失敗: '+e.message,'err'); return; }
    const {data, slots} = parsed;

    const n = Math.max(A.length, slots.length);
    let matches=0, mismatches=0, frames=0, ignores=0, malformed=0;
    const rows=[];
    for(let i=0;i<n;i++){
      const a=A[i], s=slots[i];
      if(a && s){
        const isMatch = norm(a.name)===norm(s.name);
        isMatch?matches++:mismatches++;
        // 反映
        let newG;
        if(a.hasTable){ s.block.content=a.content; s.block.group='frame'; newG='frame'; frames++; if(a.malformed) malformed++; }
        else { s.block.group='ignore'; newG='ignore'; ignores++; }
        rows.push({i,an:a.name,bn:s.name,match:isMatch,has:a.hasTable,malformed:a.malformed,g:newG});
      } else {
        rows.push({i,an:a?a.name:null,bn:s?s.name:null,nopair:true});
      }
    }

    // 出力
    const out = JSON.stringify(data);
    $('output').value = out;
    $('outLen').textContent = out.length.toLocaleString()+' 文字';

    // サマリ
    $('summary').innerHTML =
      stat(matches,'名前一致') +
      stat(mismatches,'名前不一致', mismatches?'bad':'') +
      stat(frames,'frame 化（表示）') +
      stat(ignores,'ignore 化（非表示）') +
      stat(malformed,'要確認テーブル', malformed?'warn':'');

    // バナー
    let banners='';
    if(A.length!==slots.length){
      banners += `<div class="banner err">⚠ <span>A の分野数（${A.length}）と B のスロット数（${slots.length}）が一致しません。上詰めで対応付けています。余剰行は「対応なし」と表示します。</span></div>`;
    }
    if(mismatches>0){
      banners += `<div class="banner warn">⚠ <span>名前が一致しない行が ${mismatches} 件あります（位置ベースなので処理は実行済み）。下表の赤い行をご確認ください。</span></div>`;
    }
    if(malformed>0){
      banners += `<div class="banner warn">⚠ <span>テーブル構造が不完全な分野が ${malformed} 件あります（例: セルが閉じていない）。元データをご確認ください。</span></div>`;
    }
    $('banners').innerHTML = banners;

    // 照合表
    $('cmpBody').innerHTML = rows.map(r=>{
      if(r.nopair){
        return `<tr class="nopair"><td class="no">${r.i+1}</td>
          <td class="name">${r.an?esc(r.an):'<i style="color:#b3ad9f">—</i>'}</td>
          <td class="name">${r.bn?esc(r.bn):'<i style="color:#b3ad9f">—</i>'}</td>
          <td colspan="3"><span class="pill nomatch">対応なし</span></td></tr>`;
      }
      return `<tr class="${r.match?'':'mismatch'}">
        <td class="no">${r.i+1}</td>
        <td class="name">${esc(r.an)}${r.malformed?'<span class="flag">⚠ テーブル構造が不完全</span>':''}</td>
        <td class="name">${esc(r.bn)}</td>
        <td><span class="pill ${r.match?'match':'nomatch'}">${r.match?'✓ 一致':'✗ 不一致'}</span></td>
        <td><span class="pill ${r.has?'has':'empty'}">${r.has?'○ あり':'× 空'}</span></td>
        <td><span class="g ${r.g}">${r.g}</span></td>
      </tr>`;
    }).join('');

    $('result').classList.add('show');
    setMsg(`変換完了：${frames+ignores} スロット処理`, 'ok');
  }

  function stat(n,l,cls){
    return `<div class="stat ${cls||''}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  }
})();
</script>
</body>
</html>
